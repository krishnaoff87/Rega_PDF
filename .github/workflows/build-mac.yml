name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies (Ghostscript)
      run: brew install ghostscript

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r MAC_VERSION/requirements.txt
        pip install pyinstaller

    - name: Build macOS App Bundle
      run: |
        cd MAC_VERSION
        pyinstaller --noconfirm --windowed --name "PDFCompressor" \
          --add-data "static:static" \
          --add-data "templates:templates" \
          --icon "icon.ico" \
          launcher.py

    - name: Create DMG Installer
      run: |
        cd MAC_VERSION
        hdiutil create -volname "PDF Compressor" -srcfolder "dist/PDFCompressor.app" -ov -format UDZO "PDFCompressor_Mac.dmg"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDFCompressor-Mac-Installer
        path: MAC_VERSION/PDFCompressor_Mac.dmg
