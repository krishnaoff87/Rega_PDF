name: Android Build & APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x ANDROID_APP/gradlew
    
    - name: Build Release APK
      working-directory: ANDROID_APP
      run: ./gradlew assembleRelease
    
    - name: Build Debug APK
      working-directory: ANDROID_APP
      run: ./gradlew assembleDebug
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: ANDROID_APP/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ANDROID_APP/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## APK Build Complete
          
          Download the APKs from the assets below:
          - **app-release-unsigned.apk** - Release build (unsigned)
          - **app-debug.apk** - Debug build
          
          ### Build Information
          - Build Date: ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.sha }}
